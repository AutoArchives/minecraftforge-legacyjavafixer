plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'legacyjavafixer'

//formatter:off
dependencyResolutionManagement.versionCatalogs.register('libs') {
    plugin 'licenser',    'net.minecraftforge.licenser'    version '1.2.0'
    plugin 'gradleutils', 'net.minecraftforge.gradleutils' version '3.3.21'
    plugin 'gitversion',  'net.minecraftforge.gitversion'  version '3.1.6'
    plugin 'forgegradle', 'net.minecraftforge.gradle'      version '7.0.40'
    
    library 'launchwrapper', 'net.minecraft',      'launchwrapper' version '1.11'
    library 'forge',         'net.minecraftforge', 'forge'         version '1.6.4-9.11.1.964'
}
//formatter:on