plugins {
    id 'java-library'
    id 'maven-publish'
    alias libs.plugins.licenser
    alias libs.plugins.gitversion
    alias libs.plugins.gradleutils
    alias libs.plugins.forgegradle
}

gradleutils.displayName = 'Legacy Java Fixer'
description = 'A tweaker that fixes legacy Forge versions for the sorting change in java 8u20'
version = gitversion.tagOffset
group = 'net.minecraftforge'
println "Version: $version"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

repositories {
    minecraft.mavenizer(it)
    mavenCentral()
    maven gradleutils.forgeMaven
    maven { url = 'https://libraries.minecraft.net/' }
}

minecraft {
    runs {
        configureEach {
            systemProperty 'fml.coreMods.load', 'net.minecraftforge.legacyjavafixer.LoadingPlugin'
        }
        register('client') {
            workingDir = file('runs/main/client/')
            systemProperty 'fml.ignoreInvalidMinecraftCertificates', 'true'
        }
    }
}

dependencies {
    // We just need the classes to compile against, but include the full thing so we can test run configs
    implementation minecraft.dependency(libs.forge)
}

license {
    header rootProject.file('LICENSE-header.txt')
    newLine false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


tasks.named('jar', Jar) {
    manifest {
        attributes(
            'TweakClass': 'net.minecraftforge.legacyjavafixer.Tweaker',
            'TweakOrder': -2147483648
        )
    }
}

publishing {
    publications.register('mavenJava', MavenPublication) {
        // This causes it to skip any transitive dependencies in the pom
        artifact tasks.named('jar')
        
        gradleutils.promote(it)

        pom { pom ->
            name = gradleutils.displayName
            description = project.description

            gradleutils.pom.addRemoteDetails(pom)

            licenses {
                license gradleutils.pom.licenses.MIT
            }

            developers {
                developer gradleutils.pom.developers.LexManos
            }
        }
    }

    repositories {
        maven gradleutils.publishingForgeMaven
    }
}

